<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<link rel="stylesheet" href="/app.css">
<title>Morning List</title>
</head>
<body class="app">
<aside class="side">
  <a class="brand" href="#today">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 15a7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M2 19h20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M12 3v2.5M4.6 6.6l1.8 1.8M19.4 6.6l-1.8 1.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span><b>Morning List</b><small>Coldline Refrigeration</small></span>
  </a>
  <nav class="nav" id="nav" aria-label="Main">
    <a href="#today" data-view="today"><span>Today</span><em id="nav-count" hidden></em></a>
    <a href="#jobs" data-view="jobs"><span>Jobs</span></a>
    <a href="#add" data-view="add"><span>New job</span></a>
  </nav>
  <div class="side-foot">
    <button type="button" id="tour">Tour</button>
    <a href="#help" data-view="help">Help</a>
    <button type="button" id="logout">Log out</button>
  </div>
</aside>
<main id="main"><p class="muted">Loading your list...</p></main>
<dialog id="dlg"><div class="dlg" id="dlg-body"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/app.js"></script>
</body>
</html>
